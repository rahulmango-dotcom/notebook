    <!-- ─── NOTEBOOK ─── -->
    <div class="notebook">

        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <h1>
                    📓 reguilungle nza
                    <small>UNLIMITED</small>
                </h1>
            </div>
            <div class="header-actions">
                <button id="installBtn" aria-label="Install app">📲 Install</button>
                <button class="dark-toggle" id="darkToggle" aria-label="Toggle dark mode">🌙</button>
                <span class="note-count" id="noteCount">0 notes</span>
            </div>
        </div>

        <!-- Search -->
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search notes…" />
            <button class="clear-search" id="clearSearch" aria-label="Clear search">✕</button>
        </div>

        <!-- Title -->
        <input type="text" class="title-input" id="noteTitle" placeholder="Note title…" maxlength="60" />

        <!-- Textarea -->
        <textarea class="note-area" id="noteContent" placeholder="Write your note here…" spellcheck="true"></textarea>

        <!-- Status Bar -->
        <div class="status-bar">
            <div class="stats">
                <span id="wordCount">0 words</span>
                <span id="charCount">0 chars</span>
                <span id="modifiedTime">—</span>
            </div>
            <span class="save-status">
                <span class="dot" id="saveDot"></span>
                <span id="saveLabel">Ready</span>
            </span>
        </div>

        <!-- Toolbar -->
        <div class="toolbar">
            <button class="btn-primary" id="saveBtn">💾 Save</button>
            <button class="btn-success" id="loadBtn">📂 Load</button>
            <button class="btn-outline" id="newBtn">✨ New</button>
            <button class="btn-danger" id="deleteBtn">🗑️ Delete</button>
            <button class="btn-outline" id="exportBtn">⬇️ Export</button>
            <button class="btn-outline" id="importBtn">⬆️ Import</button>
        </div>

        <!-- Saved Notes List -->
        <div class="notes-list-section">
            <div class="notes-list-header">
                <h3>📄 Saved Notes</h3>
                <button class="clear-all-btn" id="clearAllBtn">Clear All</button>
            </div>
            <div class="notes-list" id="notesList">
                <div class="empty-notes-msg">No saved notes yet.</div>
            </div>
        </div>

        <!-- Hidden file input for import -->
        <input type="file" id="importFile" accept=".txt" />
    </div>

    <!-- ─── TOAST ─── -->
    <div class="toast" id="toast"></div>

    <!-- ─── SCRIPT ─── -->
    <script>
        (function() {
            'use strict';

            // ─── DOM refs ───
            const titleInput = document.getElementById('noteTitle');
            const contentArea = document.getElementById('noteContent');
            const wordCount = document.getElementById('wordCount');
            const charCount = document.getElementById('charCount');
            const modifiedTime = document.getElementById('modifiedTime');
            const saveDot = document.getElementById('saveDot');
            const saveLabel = document.getElementById('saveLabel');
            const notesListEl = document.getElementById('notesList');
            const noteCountEl = document.getElementById('noteCount');
            const toastEl = document.getElementById('toast');
            const searchInput = document.getElementById('searchInput');
            const clearSearch = document.getElementById('clearSearch');
            const installBtn = document.getElementById('installBtn');

            const saveBtn = document.getElementById('saveBtn');
            const loadBtn = document.getElementById('loadBtn');
            const newBtn = document.getElementById('newBtn');
            const deleteBtn = document.getElementById('deleteBtn');
            const clearAllBtn = document.getElementById('clearAllBtn');
            const exportBtn = document.getElementById('exportBtn');
            const importBtn = document.getElementById('importBtn');
            const importFile = document.getElementById('importFile');
            const darkToggle = document.getElementById('darkToggle');

            // ─── State ───
            const DB_NAME = 'NotebookDB';
            const STORE_NAME = 'notes';
            const DARK_KEY = 'notebook_dark';
            let notes = [];
            let currentId = null;
            let saveTimeout = null;
            let searchQuery = '';
            let darkMode = false;
            let deferredPrompt = null;
            let db = null;

            // ─── IndexedDB Helpers ───
            function openDB() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open(DB_NAME, 1);
                    request.onupgradeneeded = (event) => {
                        const db = event.target.result;
                        if (!db.objectStoreNames.contains(STORE_NAME)) {
                            db.createObjectStore(STORE_NAME, { keyPath: 'id' });
                        }
                    };
                    request.onsuccess = (event) => {
                        db = event.target.result;
                        resolve(db);
                    };
                    request.onerror = (event) => {
                        reject(event.target.error);
                    };
                });
            }

            async function getAllNotes() {
                if (!db) await openDB();
                return new Promise((resolve, reject) => {
                    const transaction = db.transaction(STORE_NAME, 'readonly');
                    const store = transaction.objectStore(STORE_NAME);
                    const request = store.getAll();
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
            }

            // OPTIMIZED: Save only a single note (instead of rewriting all)
            async function saveNoteToDB(note) {
                if (!db) await openDB();
                return new Promise((resolve, reject) => {
                    const transaction = db.transaction(STORE_NAME, 'readwrite');
                    const store = transaction.objectStore(STORE_NAME);
                    const request = store.put(note);
                    request.onsuccess = () => resolve();
                    request.onerror = () => reject(request.error);
                });
            }

            async function deleteNoteByIdDB(id) {
                if (!db) await openDB();
                return new Promise((resolve, reject) => {
                    const transaction = db.transaction(STORE_NAME, 'readwrite');
                    const store = transaction.objectStore(STORE_NAME);
                    const request = store.delete(id);
                    request.onsuccess = () => resolve();
                    request.onerror = () => reject(request.error);
                });
            }

            async function clearAllNotesDB() {
                if (!db) await openDB();
                return new Promise((resolve, reject) => {
                    const transaction = db.transaction(STORE_NAME, 'readwrite');
                    const store = transaction.objectStore(STORE_NAME);
                    const request = store.clear();
                    request.onsuccess = () => resolve();
                    request.onerror = () => reject(request.error);
                });
            }

            // ─── Migration from localStorage ───
            async function migrateFromLocalStorage() {
                try {
                    const oldData = localStorage.getItem('notebook_notes_pwa');
                    if (oldData) {
                        const parsed = JSON.parse(oldData);
                        if (Array.isArray(parsed) && parsed.length > 0) {
                            console.log('Migrating notes from localStorage to IndexedDB...');
                            // Import one by one using the optimized save
                            for (const note of parsed) {
                                await saveNoteToDB(note);
                            }
                            localStorage.removeItem('notebook_notes_pwa');
                            showToast('📦 Migrated notes to unlimited storage!', 2000);
                            return true;
                        }
                    }
                } catch (e) { /* ignore */ }
                return false;
            }

            // ─── Request Persistent Storage (unlimited space) ───
            async function requestPersistentStorage() {
                try {
                    if ('storage' in navigator && 'persist' in navigator.storage) {
                        const isPersisted = await navigator.storage.persisted();
                        if (!isPersisted) {
                            const granted = await navigator.storage.persist();
                            if (granted) {
                                console.log('✅ Persistent storage granted – unlimited space!');
                                showToast('💾 Unlimited storage enabled!', 2000);
                            } else {
                                console.log('⚠️ Persistent storage denied – still limited to ~10MB.');
                                showToast('⚠️ Storage limit may apply (allow permission for unlimited).', 2500);
                            }
                        } else {
                            console.log('✅ Persistent storage already enabled.');
                        }
                    }
                } catch (e) {
                    console.warn('Persistent storage not supported:', e);
                }
            }

            // ─── Helpers ───
            function generateId() {
                return Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
            }

            function getWordCount(text) {
                const trimmed = text.trim();
                if (!trimmed) return 0;
                return trimmed.split(/\s+/).length;
            }

            function getPreview(text, max = 60) {
                const clean = text.replace(/\s+/g, ' ').trim();
                if (clean.length <= max) return clean;
                return clean.slice(0, max) + '…';
            }

            function formatDate(ts) {
                const d = new Date(ts);
                return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) +
                    ' ' + d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            // ─── Toast ───
            let toastTimer = null;

            function showToast(message, duration = 2200) {
                toastEl.textContent = message;
                toastEl.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => {
                    toastEl.classList.remove('show');
                }, duration);
            }

            // ─── Dark Mode ───
            function setDarkMode(enabled) {
                darkMode = enabled;
                document.body.classList.toggle('dark', enabled);
                darkToggle.textContent = enabled ? '☀️' : '🌙';
                try { localStorage.setItem(DARK_KEY, enabled ? '1' : '0'); } catch (_) {}
            }

            function toggleDark() {
                setDarkMode(!darkMode);
            }

            function loadDarkPreference() {
                try {
                    const val = localStorage.getItem(DARK_KEY);
                    if (val === '1') setDarkMode(true);
                    else setDarkMode(false);
                } catch (_) { setDarkMode(false); }
            }

            // ─── Storage ───
            async function loadNotesFromStorage() {
                try {
                    const data = await getAllNotes();
                    notes = data || [];
                } catch (_) {
                    notes = [];
                }
                notes.sort((a, b) => (b.updated || 0) - (a.updated || 0));
            }

            // ─── Filtered notes ───
            function getFilteredNotes() {
                if (!searchQuery.trim()) return notes;
                const q = searchQuery.trim().toLowerCase();
                return notes.filter(n =>
                    (n.title || '').toLowerCase().includes(q) ||
                    (n.content || '').toLowerCase().includes(q)
                );
            }

            // ─── Render list ───
            function renderNotesList() {
                const filtered = getFilteredNotes();

                if (filtered.length === 0) {
                    if (notes.length === 0) {
                        notesListEl.innerHTML = `<div class="empty-notes-msg">No saved notes yet.</div>`;
                    } else {
                        notesListEl.innerHTML = `<div class="no-search-msg">No notes match “${escapeHtml(searchQuery)}”</div>`;
                    }
                    noteCountEl.textContent = notes.length + ' note' + (notes.length !== 1 ? 's' : '');
                    return;
                }

                let html = '';
                filtered.forEach(note => {
                    const preview = getPreview(note.content || '', 60);
                    const title = note.title || 'Untitled';
                    const dateStr = formatDate(note.updated || Date.now());
                    html += `
                        <div class="note-item" data-id="${note.id}">
                            <div class="note-meta">
                                <span class="note-item-title">${escapeHtml(title)}</span>
                                <span class="note-item-preview">${escapeHtml(preview)} · ${dateStr}</span>
                            </div>
                            <div class="note-item-actions">
                                <button class="load-btn" data-id="${note.id}">Open</button>
                                <button class="del-btn" data-id="${note.id}">✕</button>
                            </div>
                        </div>
                    `;
                });
                notesListEl.innerHTML = html;
                noteCountEl.textContent = notes.length + ' note' + (notes.length !== 1 ? 's' : '');

                notesListEl.querySelectorAll('.load-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        loadNoteById(btn.dataset.id);
                    });
                });
                notesListEl.querySelectorAll('.del-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        deleteNoteById(btn.dataset.id);
                    });
                });
                notesListEl.querySelectorAll('.note-item').forEach(item => {
                    item.addEventListener('click', () => {
                        const id = item.dataset.id;
                        if (id) loadNoteById(id);
                    });
                });
            }

            // ─── CRUD ───
            async function saveCurrentNote() {
                const title = titleInput.value.trim() || 'Untitled';
                const content = contentArea.value;

                if (!content.trim() && !titleInput.value.trim()) {
                    showToast('Nothing to save — note is empty.', 1600);
                    return;
                }

                let note;
                if (currentId) {
                    const existing = notes.find(n => n.id === currentId);
                    if (existing) {
                        existing.title = title;
                        existing.content = content;
                        existing.updated = Date.now();
                        note = existing;
                    } else {
                        note = { id: generateId(), title, content, updated: Date.now() };
                        notes.push(note);
                        currentId = note.id;
                    }
                } else {
                    note = { id: generateId(), title, content, updated: Date.now() };
                    notes.push(note);
                    currentId = note.id;
                }

                // OPTIMIZED: Save only this note
                await saveNoteToDB(note);
                renderNotesList();
                updateStatus('saved', 'Saved');
                updateModifiedTime(note.updated);
                showToast('✅ Note saved!', 1400);
                setSaveDot('saved');
            }

            function loadNoteById(id) {
                const note = notes.find(n => n.id === id);
                if (!note) {
                    showToast('Note not found.', 1600);
                    return;
                }
                titleInput.value = note.title || '';
                contentArea.value = note.content || '';
                currentId = note.id;
                updateWordAndChar();
                updateStatus('saved', 'Loaded');
                updateModifiedTime(note.updated);
                setSaveDot('saved');
                showToast(`📂 Loaded “${note.title || 'Untitled'}”`, 1400);
                contentArea.scrollTop = 0;
                titleInput.focus();
                titleInput.select();
            }

            async function deleteNoteById(id) {
                if (!confirm('Delete this note?')) return;
                const idx = notes.findIndex(n => n.id === id);
                if (idx === -1) return;
                const note = notes[idx];
                notes.splice(idx, 1);
                await deleteNoteByIdDB(id);

                if (currentId === id) {
                    titleInput.value = '';
                    contentArea.value = '';
                    currentId = null;
                    updateWordAndChar();
                    updateStatus('ready', 'Ready');
                    setSaveDot('idle');
                    updateModifiedTime(null);
                }

                renderNotesList();
                showToast(`🗑️ Deleted “${note.title || 'Untitled'}”`, 1600);
            }

            async function clearAllNotes() {
                if (notes.length === 0) {
                    showToast('No notes to clear.', 1400);
                    return;
                }
                if (!confirm('Delete ALL notes? This cannot be undone.')) return;
                notes = [];
                await clearAllNotesDB();
                titleInput.value = '';
                contentArea.value = '';
                currentId = null;
                updateWordAndChar();
                updateStatus('ready', 'Ready');
                setSaveDot('idle');
                updateModifiedTime(null);
                renderNotesList();
                showToast('🗑️ All notes cleared.', 1600);
            }

            function newNote() {
                if (contentArea.value.trim() || titleInput.value.trim()) {
                    if (!confirm('Discard current note?')) return;
                }
                titleInput.value = '';
                contentArea.value = '';
                currentId = null;
                updateWordAndChar();
                updateStatus('ready', 'Ready');
                setSaveDot('idle');
                updateModifiedTime(null);
                titleInput.focus();
                showToast('✨ New note ready', 1200);
            }

            // ─── Export ───
            function exportNote() {
                const title = titleInput.value.trim() || 'Untitled';
                const content = contentArea.value;
                if (!content.trim() && !titleInput.value.trim()) {
                    showToast('Nothing to export – note is empty.', 1600);
                    return;
                }
                const text = `${title}\n${'='.repeat(title.length)}\n\n${content}`;
                const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${title}.txt`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast('⬇️ Exported!', 1400);
            }

            // ─── Import ───
            function importFromFile(file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const text = e.target.result;
                    const lines = text.split(/\r?\n/);
                    let title = 'Imported';
                    let content = text;
                    if (lines.length >= 2 && lines[1].startsWith('=')) {
                        title = lines[0].trim() || 'Imported';
                        content = lines.slice(2).join('\n');
                    } else {
                        if (lines.length > 1) {
                            title = lines[0].trim() || 'Imported';
                            content = lines.slice(1).join('\n');
                        } else {
                            content = text;
                        }
                    }
                    titleInput.value = title;
                    contentArea.value = content;
                    currentId = null;
                    updateWordAndChar();
                    updateStatus('ready', 'Ready');
                    setSaveDot('idle');
                    updateModifiedTime(null);
                    showToast('📄 Imported successfully! Save to keep.', 1800);
                    triggerAutoSave();
                };
                reader.readAsText(file);
            }

            // ─── Status helpers ───
            function updateStatus(type, label) {
                saveLabel.textContent = label;
            }

            function setSaveDot(state) {
                saveDot.className = 'dot';
                if (state === 'saved') saveDot.classList.add('saved');
                else if (state === 'saving') saveDot.classList.add('saving');
            }

            function updateWordAndChar() {
                const text = contentArea.value;
                const words = getWordCount(text);
                const chars = text.length;
                wordCount.textContent = words + ' word' + (words !== 1 ? 's' : '');
                charCount.textContent = chars + ' char' + (chars !== 1 ? 's' : '');
            }

            function updateModifiedTime(ts) {
                if (ts) {
                    modifiedTime.textContent = '✎ ' + formatDate(ts);
                } else {
                    modifiedTime.textContent = '—';
                }
            }

            // ─── Auto-save ───
            function triggerAutoSave() {
                if (saveTimeout) clearTimeout(saveTimeout);
                setSaveDot('saving');
                updateStatus('saving', 'Saving…');
                saveTimeout = setTimeout(() => {
                    if (contentArea.value.trim() || titleInput.value.trim()) {
                        saveCurrentNote();
                    } else {
                        setSaveDot('idle');
                        updateStatus('ready', 'Ready');
                    }
                    saveTimeout = null;
                }, 700);
            }

            // ─── Search handling ───
            function handleSearch() {
                searchQuery = searchInput.value;
                clearSearch.classList.toggle('visible', searchQuery.length > 0);
                renderNotesList();
            }

            function clearSearchInput() {
                searchInput.value = '';
                handleSearch();
                searchInput.focus();
            }

            // ─── Load most recent ───
            function loadMostRecent() {
                if (notes.length === 0) return;
                const latest = notes[0];
                loadNoteById(latest.id);
            }

            // ─── PWA Installation ───
            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
                installBtn.style.display = 'inline-flex';
            });

            installBtn.addEventListener('click', async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const result = await deferredPrompt.userChoice;
                    if (result.outcome === 'accepted') {
                        showToast('🎉 App installed!', 2000);
                        installBtn.style.display = 'none';
                    } else {
                        showToast('Installation cancelled.', 1400);
                    }
                    deferredPrompt = null;
                } else {
                    showToast('Open this page in Chrome or Edge to install.', 1800);
                }
            });

            // ─── Event listeners ───
            titleInput.addEventListener('input', () => {
                updateWordAndChar();
                triggerAutoSave();
            });

            contentArea.addEventListener('input', () => {
                updateWordAndChar();
                triggerAutoSave();
            });

            searchInput.addEventListener('input', handleSearch);
            clearSearch.addEventListener('click', clearSearchInput);

            saveBtn.addEventListener('click', saveCurrentNote);
            loadBtn.addEventListener('click', () => {
                if (notes.length === 0) {
                    showToast('No saved notes to load.', 1400);
                    return;
                }
                document.querySelector('.notes-list-section').scrollIntoView({ behavior: 'smooth', block: 'center' });
                showToast('📂 Click a note below to open.', 1600);
            });
            newBtn.addEventListener('click', newNote);
            deleteBtn.addEventListener('click', () => {
                if (!currentId) {
                    showToast('No note is currently open.', 1400);
                    return;
                }
                deleteNoteById(currentId);
            });
            clearAllBtn.addEventListener('click', clearAllNotes);
            exportBtn.addEventListener('click', exportNote);
            importBtn.addEventListener('click', () => importFile.click());
            importFile.addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    importFromFile(e.target.files[0]);
                }
                e.target.value = '';
            });

            darkToggle.addEventListener('click', toggleDark);

            document.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                    e.preventDefault();
                    saveCurrentNote();
                }
                if ((e.ctrlKey || e.metaKey) && e.key === 'n') {
                    e.preventDefault();
                    newNote();
                }
                if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'Delete') {
                    e.preventDefault();
                    if (currentId) deleteNoteById(currentId);
                }
                if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
                    e.preventDefault();
                    searchInput.focus();
                    searchInput.select();
                }
            });

            // ─── Init ───
            async function init() {
                loadDarkPreference();
                
                try {
                    await openDB();
                } catch (e) {
                    console.error('Failed to open DB', e);
                    showToast('⚠️ Storage error – using memory only.', 3000);
                }

                const migrated = await migrateFromLocalStorage();

                await loadNotesFromStorage();
                renderNotesList();

                if (notes.length > 0 && !migrated) {
                    loadMostRecent();
                } else if (notes.length > 0 && migrated) {
                    loadMostRecent();
                } else {
                    updateWordAndChar();
                    updateStatus('ready', 'Ready');
                    setSaveDot('idle');
                    updateModifiedTime(null);
                    contentArea.placeholder = 'Write your first note here…';
                }

                titleInput.focus();
                searchInput.placeholder = notes.length > 0 ? 'Search notes…' : 'Search (no notes yet)';

                await requestPersistentStorage();
            }

            init();

            // ─── Service Worker Registration ───
            if ('serviceWorker' in navigator) {
                const swCode = `
                    self.addEventListener('install', event => {
                        event.waitUntil(
                            caches.open('notebook-v1').then(cache => {
                                return cache.addAll(['./']);
                            })
                        );
                        self.skipWaiting();
                    });
                    self.addEventListener('activate', event => {
                        event.waitUntil(clients.claim());
                    });
                    self.addEventListener('fetch', event => {
                        event.respondWith(
                            caches.match(event.request).then(response => {
                                return response || fetch(event.request);
                            })
                        );
                    });
                `;
                const blob = new Blob([swCode], { type: 'application/javascript' });
                const swUrl = URL.createObjectURL(blob);
                navigator.serviceWorker.register(swUrl, { scope: './' })
                    .then(() => { /* SW ready */ })
                    .catch(() => { /* ignore */ });
            }

        })();
    </script>

</body>
</html>
